<div class="ST_IF_settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Interactive Fiction (ST_IF)</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <label class="checkbox_label">
                <input id="st_if_enabled" type="checkbox" />
                <span>Enable for this session</span>
            </label>

            <label class="checkbox_label">
                <input id="st_if_inject_rp" type="checkbox" />
                <span>Inject game state on pure roleplay turns</span>
            </label>

            <label class="checkbox_label">
                <input id="st_if_show_raw" type="checkbox" />
                <span>Show raw game output (debug)</span>
            </label>

            <label class="checkbox_label">
                <input id="st_if_companion" type="checkbox" />
                <span>Companion location tracking</span>
            </label>

            <label for="st_if_bias" title="High = the companion mirrors your moves and stays with you. Middle = trails one room behind. Low = wanders on its own.">Companion stays near player: <span id="st_if_bias_value">0.7 — glued</span></label>
            <input id="st_if_bias" type="range" min="0" max="1" step="0.1" class="text_pole" />

            <label class="checkbox_label" title="Let the companion decide each turn (follow, hang back, or go its own way). The slider becomes how clingy it is.">
                <input id="st_if_agency" type="checkbox" />
                <span>Companion can choose (agency)</span>
            </label>

            <label class="checkbox_label" title="Floating strip above the chat input showing location, exits, and inventory.">
                <input id="st_if_hud_toggle" type="checkbox" />
                <span>Show game HUD (location / exits / inventory)</span>
            </label>

            <label class="checkbox_label" title="While together, the companion may perform one game action per turn (it really happens in the world).">
                <input id="st_if_acts" type="checkbox" />
                <span>Companion can act (use things)</span>
            </label>

            <label for="st_if_initiative">Companion initiative</label>
            <select id="st_if_initiative" class="text_pole">
                <option value="asked">Only when asked</option>
                <option value="need">Asked or obvious need</option>
                <option value="proactive">Fully proactive</option>
            </select>

            <label for="st_if_act_safety">Action safety</label>
            <select id="st_if_act_safety" class="text_pole">
                <option value="safe">Safe verbs only</option>
                <option value="open">Unrestricted (still no save/restart)</option>
            </select>

            <label for="st_if_strictness">Translator strictness</label>
            <select id="st_if_strictness" class="text_pole">
                <option value="strict">Strict (only clear actions)</option>
                <option value="loose">Loose (more verbs)</option>
            </select>

            <label for="st_if_depth">Canon injection depth</label>
            <input id="st_if_depth" type="number" min="0" max="10" class="text_pole" />

            <hr />
            <div>Story file (.z5 / .z8 / .ulx / .gblorb): <span id="st_if_story_name">none loaded</span></div>
            <input id="st_if_story_file" type="file" hidden accept=".z5,.z8,.z3,.ulx,.gblorb,.zblorb,.blorb" />
            <div id="st_if_story_upload" class="menu_button">Load story file</div>

            <label for="st_if_world_select">Bundled demo world</label>
            <div class="flex-container">
                <select id="st_if_world_select" class="text_pole"></select>
                <div id="st_if_world_load" class="menu_button">Load</div>
            </div>

            <label class="checkbox_label" title="On an expandable world, walking into an undefined direction makes the narrator invent the room there (it persists). No effect on ordinary stories.">
                <input id="st_if_dynamic_world" type="checkbox" />
                <span>Dynamic world (narrator grows the map)</span>
            </label>

            <label for="st_if_growth_mode" title="Anywhere: any wall can become a new room. Guided: only grow where the room's description hints at an exit (a door, a path).">When does the map grow?</label>
            <select id="st_if_growth_mode" class="text_pole">
                <option value="anywhere">Anywhere (any direction with no exit)</option>
                <option value="guided">Guided (only where an exit is hinted)</option>
            </select>

            <label for="st_if_effect_safety" title="Whether an NPC can change game state (grant gold, set quest flags). Off: NPCs only talk. Safe: grant/flag. Open: also take.">NPC effects (rewards / quests)</label>
            <select id="st_if_effect_safety" class="text_pole">
                <option value="off">Off — NPCs only talk</option>
                <option value="safe">Safe — grant gold / set flags</option>
                <option value="open">Open — also take gold</option>
            </select>
            <label for="st_if_max_grant">Max gold an NPC can grant/take at once</label>
            <input id="st_if_max_grant" type="number" min="1" max="500" class="text_pole" />

            <div>Grown world: <span title="Use /if-map to see the rooms you've grown.">share or reload it</span></div>
            <input id="st_if_world_import_file" type="file" hidden accept=".json" />
            <div class="flex-container">
                <div id="st_if_world_export" class="menu_button" title="Download the rooms grown this chat as a JSON file.">Export world</div>
                <div id="st_if_world_import" class="menu_button" title="Load a shared world JSON: rebuilds it on a fresh Expanse.">Import world</div>
            </div>

            <hr />
            <div><b>Current room</b></div>
            <div id="st_if_room" class="st_if_room">(no game loaded)</div>
        </div>
    </div>
</div>
