<div class="ST_IF_settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Interactive Fiction (ST_IF)</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <label class="checkbox_label">
                <input id="st_if_enabled" type="checkbox" />
                <span>Enable for this session</span>
            </label>

            <label class="checkbox_label">
                <input id="st_if_inject_rp" type="checkbox" />
                <span>Inject game state on pure roleplay turns</span>
            </label>

            <label class="checkbox_label">
                <input id="st_if_show_raw" type="checkbox" />
                <span>Show raw game output (debug)</span>
            </label>

            <label class="checkbox_label">
                <input id="st_if_companion" type="checkbox" />
                <span>Companion location tracking</span>
            </label>

            <label for="st_if_bias" title="High = the companion mirrors your moves and stays with you. Middle = trails one room behind. Low = wanders on its own.">Companion stays near player: <span id="st_if_bias_value">0.7 — glued</span></label>
            <input id="st_if_bias" type="range" min="0" max="1" step="0.1" class="text_pole" />

            <label class="checkbox_label" title="Let the companion decide each turn (follow, hang back, or go its own way). The slider becomes how clingy it is.">
                <input id="st_if_agency" type="checkbox" />
                <span>Companion can choose (agency)</span>
            </label>

            <label class="checkbox_label" title="Floating strip above the chat input showing location, exits, and inventory.">
                <input id="st_if_hud_toggle" type="checkbox" />
                <span>Show game HUD (location / exits / inventory)</span>
            </label>

            <label for="st_if_strictness">Translator strictness</label>
            <select id="st_if_strictness" class="text_pole">
                <option value="strict">Strict (only clear actions)</option>
                <option value="loose">Loose (more verbs)</option>
            </select>

            <label for="st_if_depth">Canon injection depth</label>
            <input id="st_if_depth" type="number" min="0" max="10" class="text_pole" />

            <hr />
            <div>Story file (.z5 / .z8): <span id="st_if_story_name">none loaded</span></div>
            <input id="st_if_story_file" type="file" hidden accept=".z5,.z8,.z3" />
            <div id="st_if_story_upload" class="menu_button">Load story file</div>

            <hr />
            <div><b>Current room</b></div>
            <div id="st_if_room" class="st_if_room">(no game loaded)</div>
        </div>
    </div>
</div>
